schema_version: 1
status: frozen-before-complete-ppo-analysis
primary_algorithm: ppo
primary_metric: evaluation_auc
secondary_metrics:
  - final_evaluation_return
  - steps_to_success
  - final_upright_fraction
  - upright_fraction_auc
  - final_success_probability
  - first_successful_evaluation_step
  - pre_reward_advantage_magnitude
pairing_variable: seed
confidence_level: 0.95
bootstrap_samples: 10000
bootstrap_seed: 20260906
expected_runs: 160
training_budget: 1000000
final_evaluation_checkpoints: 5
final_critic_updates: 50
performance_return_threshold: -200.0
successful_evaluation_probability: 0.5
meaningful_advantage_threshold: 0.01
instability:
  approximate_kl_threshold: 0.1
  clip_fraction_threshold: 0.5
credit_step_bin: 50000
distance_bins:
  - {label: "0", minimum: 0, maximum: 0}
  - {label: "1-3", minimum: 1, maximum: 3}
  - {label: "4-8", minimum: 4, maximum: 8}
  - {label: "9-16", minimum: 9, maximum: 16}
  - {label: "17-32", minimum: 17, maximum: 32}
  - {label: "33+", minimum: 33, maximum: null}
planned_comparisons:
  dense:
    primary: ["3", full]
    supporting: [["1", full], ["16", full]]
    decision: noninferiority
    noninferiority_margin: -100.0
  delayed_8:
    primary: ["3", full]
    supporting: [["1", full], ["16", full]]
  delayed_32:
    primary: ["3", full]
    supporting: [["1", full], ["16", full]]
    test_monotonic_horizon_response: true
  sparse:
    primary: ["3", full]
    supporting: [["1", full], ["16", full]]
    mechanism_metrics:
      - first_successful_evaluation_step
      - final_upright_fraction
      - final_success_probability
      - pre_reward_advantage_magnitude
primary_interaction:
  metric: evaluation_auc
  expression: "(delayed_32:full-delayed_32:H3) - (dense:full-dense:H3)"
multiplicity:
  primary_interaction: unadjusted
  secondary_pairwise_family: holm
  exploratory_mechanisms: descriptive
censoring:
  steps_to_success: null
  first_successful_evaluation_step: null
