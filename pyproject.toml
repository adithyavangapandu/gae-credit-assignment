[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gae-credit-assignment"
version = "0.1.0"
description = "Controlled Pendulum experiments on GAE horizon and reward timing"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2.2,<3",
  "gymnasium>=1.1,<2",
  "PyYAML>=6.0.2,<7",
  "pyarrow>=19,<24",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
gcp = ["google-cloud-storage>=3.0,<4", "google-cloud-aiplatform>=1.128,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
gae-train = "gae_credit.train:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gae_credit"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Local and CI runs use CPU PyTorch; CUDA/cloud packaging is deferred.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
